<div class="login">
  <p-card [header]="title()" class="card">
    <ng-template #content>
      <form class="form">
        <p-iconfield>
          <p-inputicon class="pi pi-user" />
          <input
            type="email"
            name="email"
            pInputText
            placeholder="Email"
            [fluid]="true"
            [formControl]="email()"
            autocomplete="username"
          />
        </p-iconfield>

        <p-iconfield>
          <p-inputicon class="pi pi-lock" />
          <p-password
            name="password"
            [feedback]="false"
            placeholder="Password"
            [fluid]="true"
            [formControl]="password()"
            autocomplete="current-password"
          />
        </p-iconfield>
      </form>
    </ng-template>

    <ng-template #footer>
      <up-button label="Login" type="submit" [disabled]="buttonDisabled()" (click)="onClick()" />
    </ng-template>
  </p-card>
</div>
